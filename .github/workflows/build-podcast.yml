# Builds MP3 episodes and feed.xml from scripts/ and commits them to main.
#
# Loop protection, in order:
# 1. This workflow runs on pushes to main only when files under scripts/ change,
#    or when someone starts it with workflow_dispatch. The bot commit updates
#    episodes/, feed.xml, and index.html, which do not match that path filter.
# 2. The push uses the repository GITHUB_TOKEN. Events caused by GITHUB_TOKEN
#    do not start new workflow runs.
# 3. The bot commit message contains [skip ci].

name: Build podcast

on:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: podcast-feed
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Generate missing audio and refresh the feed
        run: python tools/build_podcast.py

      - name: Commit and push the feed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- episodes feed.xml index.html
          git status --short
          if git diff --staged --quiet; then
            echo "No feed changes to publish."
            exit 0
          fi
          git commit -m "chore: publish podcast audio and feed [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
